experiment_id: adjudicated_v03_600
parent_config: configs/experiments/tai600_human.yaml
description: Train & evaluate temporal models on adjudicated_v03.csv (175 train /
  92 val / 273 test).
project:
  id: CVF25PRJ10
  task_code: CVFP26BCPPRJC012
  seed: 42
data:
  dataset_version: reference600-test-tai-v2-20261126
  split_version: split-v0.1-chronological-embargo30s
  label_schema_version: labels-v1
  feature_schema_version: posefeat-v2
  label_source: ADJUDICATED
  override_phase: lecture
video:
  sample_fps: 10
quality_gate:
  min_visible_ratio: 0.6
  upper_body_min_visible_ratio: 0.72
  min_mean_keypoint_confidence: 0.3
sequence:
  window_seconds: 4
  stride_seconds: 2
model:
  type: lstm
  num_classes: 3
  hidden_size: 128
  num_layers: 2
  dropout: 0.3
  tcn:
    hidden_size: 64
    num_levels: 4
    kernel_size: 3
    dropout: 0.2
training:
  batch_size: 32
  optimizer: adam
  learning_rate: 0.001
  early_stopping_patience: 12
  primary_metric: macro_f1
  epochs: 40
  calibrate: true
  min_validation_coverage: 0.9
uncertainty:
  min_probability: 0.6
  output_label: UNCERTAIN
