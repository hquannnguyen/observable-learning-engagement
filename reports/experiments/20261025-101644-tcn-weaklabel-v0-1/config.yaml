experiment_id: tcn_baseline
parent_config: configs/baseline.yaml
description: Causal dilated TCN on posefeat-v1 windows for LSTM vs TCN comparison.
project:
  id: CVF25PRJ10
  task_code: CVFP26BCPPRJC012
  seed: 42
data:
  dataset_version: v0.1
  split_version: split-v0.1
  label_schema_version: labels-v1
  feature_schema_version: posefeat-v1
video:
  sample_fps: 10
pose:
  model: yolov8n-pose.pt
  confidence_threshold: 0.3
tracking:
  tracker: bytetrack.yaml
  min_track_seconds: 2.0
quality_gate:
  min_visible_ratio: 0.6
  min_mean_keypoint_confidence: 0.3
sequence:
  window_seconds: 4
  stride_seconds: 2
model:
  type: tcn
  num_classes: 3
  hidden_size: 64
  dropout: 0.2
  tcn:
    hidden_size: 64
    num_levels: 4
    kernel_size: 3
    dropout: 0.2
training:
  batch_size: 32
  optimizer: adam
  learning_rate: 0.001
  early_stopping_patience: 10
  primary_metric: macro_f1
uncertainty:
  min_probability: 0.6
  output_label: UNCERTAIN
