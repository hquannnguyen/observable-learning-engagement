# Default 3x3 classroom grid, expressed in normalized image coordinates.
# Top of the image is treated as BACK (far from the board/camera), bottom as FRONT.
# Columns are from the viewer's left to right.
# These are geometric zones, not verified seat maps; reports must say so.

grid:
  rows:
    - id: BACK
      y_min: 0.0
      y_max: 0.3333
    - id: MIDDLE
      y_min: 0.3333
      y_max: 0.6667
    - id: FRONT
      y_min: 0.6667
      y_max: 1.0
  cols:
    - id: LEFT
      x_min: 0.0
      x_max: 0.3333
    - id: CENTER
      x_min: 0.3333
      x_max: 0.6667
    - id: RIGHT
      x_min: 0.6667
      x_max: 1.0

zone_id_format: "{row}-{col}"
zone_source: GRID_3X3
