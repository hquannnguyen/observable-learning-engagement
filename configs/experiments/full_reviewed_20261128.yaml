# Experiment: full_reviewed_20261128
# Uses human-reviewed splits:
#   - Train: D:\ThiGiacMayTinh\train_full.csv (8177 labeled -> 7181 VALID)
#   - Val:   D:\ThiGiacMayTinh\val_full.csv (901 labeled -> 812 VALID)
#   - Test:  D:\ThiGiacMayTinh\test_full.csv (2083 labeled -> 1927 VALID)

experiment_id: full_reviewed_20261128
parent_config: configs/baseline.yaml
description: Train & evaluate TCN and LSTM on human-reviewed train_full/val_full/test_full CSVs.

project:
  id: CVF25PRJ10
  task_code: CVFP26BCPPRJC012
  seed: 42

data:
  dataset_version: full-reviewed-20261128
  split_version: split-v0.1
  label_schema_version: labels-v1
  feature_schema_version: posefeat-v2

video:
  sample_fps: 10

pose:
  model: yolo11m-pose.pt
  confidence_threshold: 0.35

quality_gate:
  min_visible_ratio: 0.60
  upper_body_min_visible_ratio: 0.72
  min_mean_keypoint_confidence: 0.30

sequence:
  window_seconds: 4
  stride_seconds: 2

model:
  type: lstm
  num_classes: 3
  hidden_size: 128
  num_layers: 2
  dropout: 0.30
  tcn:
    hidden_size: 64
    num_levels: 4
    kernel_size: 3
    dropout: 0.25

training:
  batch_size: 64
  optimizer: adam
  learning_rate: 0.001
  early_stopping_patience: 10
  primary_metric: macro_f1

uncertainty:
  min_probability: 0.60
  output_label: UNCERTAIN
