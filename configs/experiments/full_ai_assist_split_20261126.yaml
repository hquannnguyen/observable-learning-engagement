# Experiment: full_ai_assist_split_20261126
# Train on data/annotations/train_full_ai_assist/annotator_a.csv (7,628 VALID)
# Val on data/annotations/val_full_ai_assist/annotator_a.csv (6,908 VALID)
# Test on data/annotations/test_full_ai_assist/annotator_a.csv (3,643 VALID)
# Provenance note: all three sheets combine existing/studio HUMAN annotations with AI-assisted pose proposals.

experiment_id: full_ai_assist_split_20261126
parent_config: configs/experiments/train_human_accepted_test_only.yaml
description: Train & evaluate LSTM and TCN on full train/val/test annotator_a.csv splits (7,628 / 6,908 / 3,643 VALID).

project:
  id: CVF25PRJ10
  task_code: CVFP26BCPPRJC012
  seed: 42

data:
  dataset_version: full-ai-assist-split-20261126
  split_version: split-v0.1
  label_schema_version: labels-v1
  feature_schema_version: posefeat-v2
  label_source: HUMAN
  override_phase: lecture

video:
  sample_fps: 10

quality_gate:
  min_visible_ratio: 0.60
  upper_body_min_visible_ratio: 0.72
  min_mean_keypoint_confidence: 0.30

sequence:
  window_seconds: 4
  stride_seconds: 2

model:
  type: lstm
  num_classes: 3
  hidden_size: 128
  num_layers: 2
  dropout: 0.30
  tcn:
    hidden_size: 64
    num_levels: 4
    kernel_size: 3
    dropout: 0.20

training:
  batch_size: 64
  optimizer: adam
  learning_rate: 0.001
  early_stopping_patience: 8
  primary_metric: macro_f1

uncertainty:
  min_probability: 0.60
  output_label: UNCERTAIN
