# Experiment: adjudicated_v03_600
# Official post-adjudication 600-window dataset (386 agreed HUMAN + 154 ADJUDICATED adopting Tai + 60 OCCLUDED).
# Splits: 175 train / 92 val / 273 test (540 VALID total).

experiment_id: adjudicated_v03_600
parent_config: configs/experiments/tai600_human.yaml
description: Train & evaluate temporal models on adjudicated_v03.csv (175 train / 92 val / 273 test).

project:
  id: CVF25PRJ10
  task_code: CVFP26BCPPRJC012
  seed: 42

data:
  dataset_version: adjudicated-v03-600-20261126
  split_version: split-v0.1
  label_schema_version: labels-v1
  feature_schema_version: posefeat-v2
  label_source: ADJUDICATED
  override_phase: lecture

video:
  sample_fps: 10

quality_gate:
  min_visible_ratio: 0.60
  upper_body_min_visible_ratio: 0.72
  min_mean_keypoint_confidence: 0.30

sequence:
  window_seconds: 4
  stride_seconds: 2

model:
  type: lstm
  num_classes: 3
  hidden_size: 128
  num_layers: 2
  dropout: 0.30
  tcn:
    hidden_size: 64
    num_levels: 4
    kernel_size: 3
    dropout: 0.20

training:
  batch_size: 32
  optimizer: adam
  learning_rate: 0.001
  early_stopping_patience: 12
  primary_metric: macro_f1

uncertainty:
  min_probability: 0.60
  output_label: UNCERTAIN
