# Experiment: agreed_tai_phong_600
# Train & evaluate on strictly agreed windows between Tai (annotator_a.csv) and Phong (annotator_b.csv): 134 train / 73 val / 179 test.

experiment_id: agreed_tai_phong_600
parent_config: configs/experiments/tai600_human.yaml
description: Supervised training & evaluation on consensus subset where Tai and Phong agree (134 train / 73 val / 179 test).

project:
  id: CVF25PRJ10
  task_code: CVFP26BCPPRJC012
  seed: 42

data:
  dataset_version: agreed-tai-phong-600-20261126
  split_version: split-v0.1
  label_schema_version: labels-v1
  feature_schema_version: posefeat-v2
  label_source: HUMAN
  override_phase: lecture

video:
  sample_fps: 10

quality_gate:
  min_visible_ratio: 0.60
  upper_body_min_visible_ratio: 0.72
  min_mean_keypoint_confidence: 0.30

sequence:
  window_seconds: 4
  stride_seconds: 2

model:
  type: lstm
  num_classes: 3
  hidden_size: 64
  num_layers: 1
  dropout: 0.40
  tcn:
    hidden_size: 64
    num_levels: 4
    kernel_size: 3
    dropout: 0.25

training:
  batch_size: 16
  optimizer: adam
  learning_rate: 0.001
  early_stopping_patience: 12
  primary_metric: macro_f1

uncertainty:
  min_probability: 0.60
  output_label: UNCERTAIN
