# Experiment: posefeat-v2 (77 base features + 17 explicit keypoint masks)
# Parent baseline keeps posefeat-v1 for the legacy checkpoint.

experiment_id: lstm_posefeat_v2
parent_config: configs/baseline.yaml
description: LSTM trained on 94-dim features with explicit missing-keypoint masks.

project:
  id: CVF25PRJ10
  task_code: CVFP26BCPPRJC012
  seed: 42

data:
  dataset_version: v0.1
  split_version: split-v0.1
  label_schema_version: labels-v1
  feature_schema_version: posefeat-v2

video:
  sample_fps: 10

pose:
  model: yolov8n-pose.pt
  confidence_threshold: 0.30

tracking:
  tracker: bytetrack.yaml
  min_track_seconds: 2.0

quality_gate:
  min_visible_ratio: 0.60
  min_mean_keypoint_confidence: 0.30

sequence:
  window_seconds: 4
  stride_seconds: 2

model:
  type: lstm
  num_classes: 3
  hidden_size: 128
  num_layers: 2
  dropout: 0.30

training:
  batch_size: 32
  optimizer: adam
  learning_rate: 0.001
  early_stopping_patience: 10
  primary_metric: macro_f1

uncertainty:
  min_probability: 0.60
  output_label: UNCERTAIN
