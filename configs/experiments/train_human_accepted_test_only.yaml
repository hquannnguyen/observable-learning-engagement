# Experiment: train_human_accepted_test_only
# Train on data/annotations/train_codex_studio_v2_20261126/train_annotations_HUMAN_ACCEPTED_TEST_ONLY.csv (7,626 VALID train)
# Validate & test on Phong's real HUMAN labels from annotator_b.csv (92 VALID val / 276 VALID test).
# Provenance note: train file is a test-only fixture (49 original HUMAN + 7,577 AI-rule rows retagged HUMAN).

experiment_id: train_human_accepted_test_only
parent_config: configs/experiments/phong600_human.yaml
description: Train temporal models on train_annotations_HUMAN_ACCEPTED_TEST_ONLY.csv (7,626 train) and evaluate on Phong HUMAN val (92) / test (276).

project:
  id: CVF25PRJ10
  task_code: CVFP26BCPPRJC012
  seed: 42

data:
  dataset_version: train-human-accepted-test-only-20261126
  split_version: split-v0.1
  label_schema_version: labels-v1
  feature_schema_version: posefeat-v2
  label_source: HUMAN
  override_phase: lecture

video:
  sample_fps: 10

quality_gate:
  min_visible_ratio: 0.60
  upper_body_min_visible_ratio: 0.72
  min_mean_keypoint_confidence: 0.30

sequence:
  window_seconds: 4
  stride_seconds: 2

model:
  type: lstm
  num_classes: 3
  hidden_size: 128
  num_layers: 2
  dropout: 0.30
  tcn:
    hidden_size: 64
    num_levels: 4
    kernel_size: 3
    dropout: 0.20

training:
  batch_size: 64
  optimizer: adam
  learning_rate: 0.001
  early_stopping_patience: 10
  primary_metric: macro_f1

uncertainty:
  min_probability: 0.60
  output_label: UNCERTAIN
