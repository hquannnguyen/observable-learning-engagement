# Experiment: lstm_phong600_compact
# Lighter regularized LSTM for small HUMAN dataset (177 train / 92 val / 276 test), all phases=lecture.

experiment_id: lstm_phong600_compact
parent_config: configs/experiments/phong600_human.yaml
description: Compact 1-layer LSTM (hidden=64, dropout=0.4) for Phong 600 HUMAN with all phases verified lecture.

project:
  id: CVF25PRJ10
  task_code: CVFP26BCPPRJC012
  seed: 42

data:
  dataset_version: repo-annotator-b-600-human-lecture
  split_version: split-v0.1
  label_schema_version: labels-v1
  feature_schema_version: posefeat-v2
  label_source: HUMAN
  override_phase: lecture

video:
  sample_fps: 10

quality_gate:
  min_visible_ratio: 0.60
  upper_body_min_visible_ratio: 0.72
  min_mean_keypoint_confidence: 0.30

sequence:
  window_seconds: 4
  stride_seconds: 2

model:
  type: lstm
  num_classes: 3
  hidden_size: 64
  num_layers: 1
  dropout: 0.40

training:
  batch_size: 16
  optimizer: adam
  learning_rate: 0.001
  early_stopping_patience: 12
  primary_metric: macro_f1

uncertainty:
  min_probability: 0.60
  output_label: UNCERTAIN
